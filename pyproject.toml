[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmarks-cli"
version = "0.1.0"
description = "Simple bookmarks manager for the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
bm = "bookmarks.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/bookmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]